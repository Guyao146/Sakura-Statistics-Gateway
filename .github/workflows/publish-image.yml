name: Publish container image

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select image name
        id: image
        shell: bash
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up emulation
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package deployment files
        shell: bash
        run: |
          mkdir -p deployment/docs deployment/scripts
          cp compose.yaml README.md deployment/
          cp docs/Caddyfile docs/*.md deployment/docs/
          cp scripts/backup.py scripts/restore.py deployment/scripts/
          grep -v '^SAKURA_IMAGE=' .env.example > deployment/.env.example
          printf '\nSAKURA_IMAGE=%s@%s\n' '${{ steps.image.outputs.name }}' '${{ steps.build.outputs.digest }}' >> deployment/.env.example
          tar -czf sakura-deployment.tar.gz -C deployment .
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: sakura-deployment
          path: sakura-deployment.tar.gz
          retention-days: 30
