name: Verify published deployment

on:
  workflow_dispatch:
    inputs:
      image:
        description: Published app image tag or digest
        required: true
        type: string
      frontend_image:
        description: Published frontend image tag or digest from the same release
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      SAKURA_IMAGE: ${{ inputs.image }}
      SAKURA_FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      COMPOSE_PROJECT_NAME: sakura-verification-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Select temporary verification config
        shell: bash
        run: printf 'VERIFY_ENV_FILE=%s/sakura-verification.env\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure isolated deployment
        shell: bash
        run: |
          set -euo pipefail
          database_password=$(openssl rand -hex 24)
          admin_password="Test-Aa1!$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$database_password" "$admin_password"
          umask 077
          {
            printf 'POSTGRES_USER=sakura\nPOSTGRES_DB=sakura\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$database_password"
            printf 'DATABASE_URL=postgres://sakura:%s@postgres:5432/sakura?sslmode=disable\n' "$database_password"
            printf 'ADMIN_USERNAME=verification\nADMIN_PASSWORD=%s\n' "$admin_password"
            printf 'SESSION_SECURE=false\nPUBLIC_ORIGIN=http://127.0.0.1:8080\n'
          } > "$VERIFY_ENV_FILE"
      - name: Pull and start default monolithic Compose
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$VERIFY_ENV_FILE" -f compose.yaml pull
          docker compose --env-file "$VERIFY_ENV_FILE" -f compose.yaml up -d --wait --wait-timeout 180
      - name: Verify monolithic HTTP assets, statistics and data management
        shell: bash
        run: |
          python - <<'PY'
          import datetime, http.cookiejar, json, os, pathlib, urllib.error, urllib.request, uuid
          config = dict(line.split('=', 1) for line in pathlib.Path(os.environ['VERIFY_ENV_FILE']).read_text().splitlines() if '=' in line)
          base = 'http://127.0.0.1:8080'
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          collect_requests = 0
          def request(path, body=None, method=None, collect_origin=False):
              global collect_requests
              data = None if body is None else json.dumps(body).encode()
              headers = {'Content-Type': 'application/json'}
              if path != '/api/collect' or collect_origin:
                  headers['Origin'] = base
              if path == '/api/collect':
                  collect_requests += 1
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with opener.open(req, timeout=15) as response:
                  assert response.headers.get_content_type() == 'application/json', path
                  return json.load(response)
          def fetch(path, types):
              with opener.open(base + path, timeout=15) as response:
                  assert response.headers.get_content_type() in types, path
                  return response.read()
          def event(event_type, **extra):
              payload = {'schema_version': 1, 'event_id': str(uuid.uuid4()), 'event_type': event_type, 'occurred_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'anonymous_id': str(uuid.uuid4()), 'session_id': str(uuid.uuid4()), 'platform': 'linux', 'app_version': 'deployment-check'}
              payload.update(extra)
              return payload
          assert request('/readyz')['database'] == 'ok'
          state = request('/api/status')
          assert state['database'] == 'ok'
          if 'version' in state:
              assert isinstance(state['version'], str), state
          assert b'<html' in fetch('/', {'text/html'})
          assert b'SakuraStats' in fetch('/sdk.js', {'application/javascript', 'text/javascript'})
          assert request('/api/auth/login', {'username': config['ADMIN_USERNAME'], 'password': config['ADMIN_PASSWORD']})['username'] == config['ADMIN_USERNAME']
          app = request('/api/apps', {'name': '[Synthetic deployment verification]', 'type': 'desktop', 'allowed_origins': []})['app']
          payload = {'app_id': app['id'], 'events': [event('app_start')]}
          assert request('/api/collect', payload)['accepted'] == 1
          assert request('/api/collect', payload)['duplicates'] == 1
          totals = request('/api/apps/' + app['id'] + '/stats')['totals']
          assert totals['active'] == 1 and totals['starts'] == 1 and totals['new_visitors'] == 1 and totals['sessions'] == 0, totals
          assert request('/api/collect', {'app_id': app['id'], 'events': [event('custom', event_name='deployment_check')]})['accepted'] == 1
          stats = request('/api/apps/' + app['id'] + '/stats')
          assert stats['totals']['custom_events'] >= 1, stats['totals']
          assert stats['custom_events'] and any('deployment_check' in json.dumps(item) for item in stats['custom_events']), stats['custom_events']
          web_app = request('/api/apps', {'name': '[Synthetic path verification]', 'type': 'web', 'allowed_origins': [base], 'allowed_path_prefixes': ['/app/'], 'normalize_numeric_paths': True})['app']
          assert web_app['allowed_path_prefixes'] == ['/app/'] and web_app['normalize_numeric_paths'] is True, web_app
          assert request('/api/collect', {'app_id': web_app['id'], 'events': [event('page_view', path='/app/users/123')]}, collect_origin=True)['accepted'] == 1
          stats = request('/api/apps/' + web_app['id'] + '/stats')
          assert any(page['path'] == '/app/users/:id' and page['page_views'] >= 1 for page in stats['pages']), stats['pages']
          result = request('/api/collect', {'app_id': web_app['id'], 'events': [event('page_view', path='/other/x')]}, collect_origin=True)
          assert result['accepted'] == 0 and [item['code'] for item in result['rejected']] == ['invalid_path'], result
          # /api/metrics aggregates per-application collect counters, so the lower bound counts collect calls only.
          metrics = request('/api/metrics')
          assert metrics['totals']['requests'] >= collect_requests, (metrics, collect_requests)
          assert metrics['totals']['rejected'] >= 1, metrics
          settings = request('/api/settings')
          assert settings['retention_days'] == 0, settings
          assert settings['rate_limit_per_second'] == 2 and settings['rate_limit_burst'] == 60, settings
          # Compose defaults STATISTICS_TIMEZONE to Asia/Shanghai (UTC+8, no DST); events were just collected "today" there.
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d')
          assert request('/api/apps/%s/rebuild?from=%s&to=%s' % (app['id'], today, today), {}, method='POST')['rebuilt_days'] >= 1
          retention = request('/api/apps/' + app['id'] + '/retention?weeks=4')
          assert isinstance(retention['cohorts'], list), retention
          for cohort in retention['cohorts']:
              assert isinstance(cohort['retained'], list) and len(cohort['retained']) == 4, cohort
          patched = request('/api/apps/' + web_app['id'], {'allowed_path_prefixes': ['/other/']}, method='PATCH')['app']
          assert patched['allowed_path_prefixes'] == ['/other/'] and patched['normalize_numeric_paths'] is True, patched
          result = request('/api/collect', {'app_id': web_app['id'], 'events': [event('page_view', path='/app/users/456')]}, collect_origin=True)
          assert result['accepted'] == 0 and [item['code'] for item in result['rejected']] == ['invalid_path'], result
          assert request('/api/collect', {'app_id': web_app['id'], 'events': [event('page_view', path='/other/y')]}, collect_origin=True)['accepted'] == 1
          assert any(page['path'] == '/other/y' for page in request('/api/apps/' + web_app['id'] + '/stats')['pages'])
          request('/api/apps/' + web_app['id'], {}, method='DELETE')
          try:
              request('/api/apps/' + web_app['id'])
          except urllib.error.HTTPError as error:
              assert error.code == 404 and json.load(error)['error']['code'] == 'app_not_found', error.code
          else:
              raise AssertionError('The deleted verification application must return 404 app_not_found')
          request('/api/auth/logout', {})
          print('Published app image: HTTP readiness, static assets, SDK, login, collection, retry, statistics, path rules, custom events, runtime metrics, settings, rebuild, retention and application deletion verified.')
          PY
      - name: Start frontend profile with its exact public origin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ['VERIFY_ENV_FILE'])
          config = path.read_text()
          old = 'PUBLIC_ORIGIN=http://127.0.0.1:8080\n'
          assert config.count(old) == 1
          path.write_text(config.replace(old, 'PUBLIC_ORIGIN=http://127.0.0.1:8081\n'))
          PY
          docker compose --env-file "$VERIFY_ENV_FILE" -f compose.yaml --profile frontend pull frontend
          docker compose --env-file "$VERIFY_ENV_FILE" -f compose.yaml --profile frontend up -d --wait --wait-timeout 180
      - name: Verify frontend HTTP guide assets and API proxy
        shell: bash
        run: |
          python - <<'PY'
          import datetime, http.cookiejar, json, os, pathlib, re, urllib.error, urllib.parse, urllib.request, uuid
          config = dict(line.split('=', 1) for line in pathlib.Path(os.environ['VERIFY_ENV_FILE']).read_text().splitlines() if '=' in line)
          base = 'http://127.0.0.1:8081'
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def request(path, body=None, origin=base):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base + path, data=data, headers={'Content-Type': 'application/json', 'Origin': origin})
              with opener.open(req, timeout=15) as response:
                  assert response.headers.get_content_type() == 'application/json', path
                  return json.load(response)
          for path in ['/readyz', '/api/status']:
              state = request(path)
              assert state['status'] == 'ok' and state['database'] == 'ok', (path, state)
          with opener.open(base + '/', timeout=15) as response:
              assert response.headers.get_content_type() == 'text/html'
              html = response.read().decode('utf-8')
              assert '<html' in html.lower()
          # Follow actual same-origin Vite imports, including lazy chunks; no assumed chunk name.
          refs = re.findall(r'''(?:src|href)=["']([^"']+)["']''', html)
          pending = [urllib.parse.urljoin(base + '/', ref) for ref in refs]
          seen = set()
          marker = 'Sakura Statistics Gateway 接入指南'.encode('utf-8')
          guide_found = False
          while pending:
              url = pending.pop()
              parsed = urllib.parse.urlsplit(url)
              if parsed.netloc != urllib.parse.urlsplit(base).netloc or parsed.scheme != 'http' or not parsed.path.startswith('/assets/') or not parsed.path.endswith(('.js', '.css')) or url in seen:
                  continue
              seen.add(url)
              assert len(seen) <= 256, 'Unexpected asset graph size'
              with opener.open(url, timeout=15) as response:
                  expected = {'application/javascript', 'text/javascript'} if parsed.path.endswith('.js') else {'text/css'}
                  assert response.headers.get_content_type() in expected, url
                  body = response.read()
              guide_found = guide_found or marker in body
              if parsed.path.endswith('.js'):
                  imports = re.findall(r'''["']((?:\.{1,2}/|/?assets/)[^"'\\\s]+\.js)["']''', body.decode('utf-8'))
                  for ref in imports:
                      pending.append(urllib.parse.urljoin(base + '/' if ref.startswith('assets/') else url, ref))
          assert seen and guide_found, 'Built guide content is missing from reachable frontend assets'
          with opener.open(base + '/sdk.js', timeout=15) as response:
              assert response.headers.get_content_type() in {'application/javascript', 'text/javascript'}
              assert b'SakuraStats' in response.read()
          try:
              opener.open(base + '/assets/__deployment_check_missing__.js', timeout=15)
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError('A missing script must not return the SPA HTML')
          credentials = {'username': config['ADMIN_USERNAME'], 'password': config['ADMIN_PASSWORD']}
          try:
              request('/api/auth/login', credentials, origin='http://127.0.0.1:8080')
          except urllib.error.HTTPError as error:
              assert error.code == 403 and json.load(error)['error']['code'] == 'origin_forbidden'
          else:
              raise AssertionError('The previous monolithic origin must be rejected after switching to the frontend origin')
          assert request('/api/auth/login', credentials)['username'] == config['ADMIN_USERNAME']
          assert request('/api/auth/me')['username'] == config['ADMIN_USERNAME']
          apps = request('/api/apps')['apps']
          assert any(entry['name'] == '[Synthetic deployment verification]' for entry in apps), 'Data was not retained across app recreation'
          # The monolithic phase deletes its path-rule app; this phase creates and exercises its own app through the proxy.
          app = request('/api/apps', {'name': '[Synthetic frontend verification]', 'type': 'web', 'allowed_origins': [base]})['app']
          view = {'schema_version': 1, 'event_id': str(uuid.uuid4()), 'event_type': 'page_view', 'occurred_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'anonymous_id': str(uuid.uuid4()), 'session_id': str(uuid.uuid4()), 'platform': 'web', 'path': '/'}
          assert request('/api/collect', {'app_id': app['id'], 'events': [view]})['accepted'] == 1
          assert request('/api/apps/' + app['id'] + '/stats')['totals']['page_views'] == 1
          assert isinstance(request('/api/settings'), dict)
          request('/api/auth/logout', {})
          print(f'Published frontend image: {len(seen)} HTTP assets, built guide content, SDK MIME, JSON readiness, proxied Cookie login and Origin rejection, self-created app collection and settings verified; no browser/GUI test was run.')
          PY
      - name: Diagnostics
        if: failure()
        shell: bash
        run: docker compose --env-file "$VERIFY_ENV_FILE" -f compose.yaml --profile frontend logs --tail=80
      - name: Remove isolated verification containers
        if: always()
        shell: bash
        run: |
          if [[ -f "$VERIFY_ENV_FILE" ]]; then
            docker compose --env-file "$VERIFY_ENV_FILE" -f compose.yaml --profile frontend down -v
            rm -f "$VERIFY_ENV_FILE"
          fi
