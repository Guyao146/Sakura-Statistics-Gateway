# Local source build only. Base compose.yaml is image-only for servers.
# Set SAKURA_IMAGE=sakura-statistics-gateway:local in your local .env first.
# The optional frontend profile builds from the root too, including docs/.
services:
  app:
    image: sakura-statistics-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
  frontend:
    image: sakura-statistics-gateway-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
